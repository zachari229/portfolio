<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Zachari GANDEKON" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Portfolio - Zachari GANDEKON</title>
    <meta
      name="description"
      content="Explorez les projets réalisés par Zachari GANDEKON : sites web, applications et solutions sur mesure."
    />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://zacharigandekon.netlify.app/pages/portfolio.html"
    />

    <!-- CSS critique -->
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/portfolio.css" />

    <!-- Google Fonts non bloquant -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- FontAwesome non bloquant -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <!-- Header chargé dynamiquement -->
    <div id="header-placeholder"></div>

    <header class="section-header">
      <div class="section-label" data-i18n="nav_portfolio">
        Mes réalisations
      </div>
      <h1 class="section-title" data-i18n="portfolio_title">Portfolio</h1>
      <p class="section-sub" data-i18n="portfolio_sub">
        Découvrez quelques-uns de mes projets.
      </p>
    </header>

    <div class="portfolio-grid" id="grid"></div>

    <!-- Footer chargé dynamiquement -->
    <div id="footer-placeholder"></div>

    <!-- Ordre correct : translations.js puis main.js -->
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>

    <!-- 3. Logique portfolio -->
    <script src="/js/portfolio.js"></script>

    <script>
      // Données des projets dans les 3 langues
      const projectsData = {
        fr: [
          {
            title: "Flighthotelcargo",
            desc: "Une agence de voyage et de logistique.",
            url: "https://flighthotelcargo.com/",
            tag: "Agence web",
            screenshot: "/Image/projet1.webp",
          },
          {
            title: "Prime Care",
            desc: "PrimeCare offre des services de soins à domicile.",
            url: "https://ukgp2yflg0.wpdns.site/",
            tag: "Site de soins à domicile",
            screenshot: "/Image/Prime Care.webp",
          },

          {
            title: "RemTech",
            desc: "Une plateforme d’apprentissage des compétences numériques",
            url: "https://positive-insight-production-9ec3.up.railway.app/",
            tag: "E-learning",
            screenshot: "/Image/remtech.webp",
          },

          {
            title: "ATLAS-BTP",
            desc: "ATLAS-BTP est une entreprise spécialisée dans le secteur du BTP.",
            url: "https://atlas-btp-rt.vercel.app/",
            tag: "Site de construction",
            screenshot: "/Image/ATLAS-BTP.webp",
          },
        ],
      };

      const arrowSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`;

      const visitLabel = { fr: "Visiter", en: "Visit", es: "Visitar" };
      const viewLabel = {
        fr: "Voir le projet",
        en: "View project",
        es: "Ver proyecto",
      };

      function buildGrid(lang) {
        const grid = document.getElementById("grid");
        if (!grid) return;
        const projects = projectsData[lang] || projectsData["fr"];
        const vLabel = visitLabel[lang] || visitLabel["fr"];
        const pLabel = viewLabel[lang] || viewLabel["fr"];

        grid.innerHTML = "";
        projects.forEach((p) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
                    <div class="card-preview">
                        <img
                            src="${p.screenshot}"
                            alt="Aperçu de ${p.title}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        />
                        <div class="preview-overlay">
                            <a href="${p.url}" target="_blank" rel="noopener">
                                ${arrowSvg} ${pLabel}
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${p.title}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-footer">
                            <a href="${p.url}" target="_blank" rel="noopener" class="btn-visit">
                                ${arrowSvg} ${vLabel}
                            </a>
                            <span class="card-tag">${p.tag}</span>
                        </div>
                    </div>
                `;
          grid.appendChild(card);
        });
      }

      // Construction initiale
      document.addEventListener("DOMContentLoaded", () => {
        const lang = localStorage.getItem("lang") || "fr";
        buildGrid(lang);
      });

      // Reconstruction quand la langue change via le sélecteur
      document.addEventListener("langChanged", (e) => {
        buildGrid(e.detail.lang);
      });
    </script>

    <!-- Bouton WhatsApp flottant -->
    <a
      href="https://wa.me/2290159535545"
      target="_blank"
      class="whatsapp-float"
    >
      <i class="fab fa-whatsapp"></i>
    </a>
  </body>
</html>
